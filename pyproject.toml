[project]
name = "loom-data"
version = "0.1.0"
description = "Convert robot datasets to one export contract, then check and view them"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "av>=18.1",
    "mcap>=1.2",
    "mcap-protobuf-support>=0.5",
    "numpy>=1.24",
    "h5py>=3.10",
    "huggingface-hub>=1.0,<2.0",
    "httpx[socks]>=0.28.1,<1.0",
    "pyarrow>=15",
    "tqdm>=4.66",
]

[project.scripts]
loom-data = "loom_data.cli:run"

[project.optional-dependencies]
model-preview = ["mujoco>=3.3,<4"]
viewer = ["pillow>=10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
loom_data = ["viewer/*.html", "viewer/*.js", "viewer/vendor/*"]
